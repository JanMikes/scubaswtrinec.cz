# Bound Apache's memory footprint by design instead of by OOM kill.
#
# php:7.1-apache runs mpm_prefork: one process per concurrent request, each able
# to grow to PHP's memory_limit (128M). Debian's default MaxRequestWorkers is
# 150, so a burst of concurrent requests can theoretically claim ~19 GB — and the
# container's memory limit (768m on lily.srv) turns that into an OOM kill of the
# whole cgroup (Apache dies, healthcheck fails, container restarts) rather than a
# queue. Steady-state usage of this site is ~60 MiB.
#
# 40 workers x 128M worst case = ~5 GB theoretical, but real pages use ~10-15 MB,
# so the realistic ceiling is ~600 MB — comfortably inside the container limit,
# while 40 concurrent requests is far more than this site will ever serve.
# Excess connections queue in the listen backlog instead of blowing up RAM.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          6
    MaxRequestWorkers        40
    # Recycle a worker after N requests so any slow leak in a 2014-era codebase
    # (or in PHP 7.1 itself) cannot accumulate for the life of the container.
    MaxConnectionsPerChild   1000
</IfModule>
