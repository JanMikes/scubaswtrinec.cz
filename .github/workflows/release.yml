# Release: build+push this app's image, then trigger its deploy on lily.
#
# Runs only after the `Tests` workflow succeeded on main (tests gate the release, same pattern as
# tipovacka/wtips and dmarc/sendvery). This app's deploy.sh + compose live in the INFRA repo
# (TheDevs-cz/lily.srv, apps/scubaswtrinec). No SSH key here: the shared reusable workflow builds
# + pushes the ghcr image and HMAC-POSTs https://deploy.lily.srv.thedevs.cz/hooks/scubaswtrinec;
# the box's executor runs /srv/scubaswtrinec/deploy.sh <tag> (Contract G: dump_secrets ->
# migrations one-off -> rollout). A leak of the secret can only redeploy THIS app from THIS image.
#
# Requires GH secret DEPLOY_WEBHOOK_SECRET (per-app HMAC key), passed EXPLICITLY (secrets: inherit
# does not cross owners). GITHUB_TOKEN is automatic.

name: Release

on:
    workflow_run:
        workflows: [Tests]
        types:
            - completed
        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    ship:
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            # app id == hook id == apps/scubaswtrinec/ == /srv/scubaswtrinec/ == Infisical project.
            app: scubaswtrinec
            # The ghcr package is named after the REPO (with the TLD) — must match `image:` in
            # lily.srv apps/scubaswtrinec/compose.yaml.
            image: ghcr.io/janmikes/scubaswtrinec.cz
            deploy_host: lily.srv.thedevs.cz
            # Deploy the exact immutable sha-<git-sha> tag this run built.
            deploy_sha: true
            build_args: APP_VERSION=${{ github.event.workflow_run.head_sha }}
            # Fire-and-forget (no per-repo checks:write PAT on the box yet — lily backlog).
            await_deploy: false
